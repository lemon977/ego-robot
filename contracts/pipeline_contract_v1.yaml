global_invariants:
  - one_artifact_type_has_exactly_one_producer
  - every_input_is_manifest_referenced_and_sha256_verified
  - ordinary_files_only_for_formal_inputs
  - no_legacy_raw_or_staging_fallback
  - no_session_id_or_frame_id_conditionals
  - no_per_frame_manual_thresholds
  - no_hidden_fallback
  - qa_never_mutates_or_reruns_upstream
  - missing_model_weight_threshold_or_evidence_means_hold
  - calibration_overlay_is_task_card_bound_dimensionless_and_never_formal
  - lower_quality_gate_failure_cannot_be_hidden_by_higher_layer
  - published_versions_are_immutable
  - synthetic_test_only_artifacts_are_never_formal_inputs
  - reveal_identity_requires_pre_and_post_object_overlap_accounting
  - reject_or_hold_requires_central_evidence_registry_entry_before_human_review_closure
  - mask_producer_and_mask_auditor_have_independent_version_identities
  - candidate_ranking_requires_same_frozen_auditor_and_same_frozen_houb_benchmark
  - historical_metrics_from_different_auditors_or_frame_scopes_are_not_rankable
  - blind_benchmark_labels_are_never_read_by_mask_producer
  - v9_is_terminal_for_the_current_heuristic_line_and_v10_heuristic_is_not_authorized

execution_modes:
  G2_CALIBRATION:
    authorized: false
    session_binding: VERIFIED_SOURCE_MANIFEST_SESSION
    product_line_binding: REGISTERED_PRODUCT_LINE
    allowed_stages: [session_context, canary_set, mask_evidence, mask_independent_qa, verified_reveal_policy, object_evidence_read_only_adapter, object_texture_donor, temporal_atlas_manifest, route_decision, reveal_labels, clean_layers, clean_coverage, mask_clean_review_package, machine_qa]
    authorization_blockers: [B3_BLIND_EVALUATION_NOT_AUTHORIZED, UNIFORM_CANDIDATE_REEVALUATION_NOT_COMPLETE, HUMAN_CANDIDATE_REVIEW_NOT_COMPLETE]
    required_terminal_state: HOLD_B3_AND_BLIND_EVALUATION_NOT_AUTHORIZED
    task_card_required: true
    dimensionless_calibration_overlay_required: true
    output_artifact_state: G2_CALIBRATION_CANDIDATE
    processed_write_allowed: false
  FORMAL_PRODUCTION:
    authorized: false
    clean_enabled: false
    profile_lifecycle_required: FROZEN
    unreviewed_calibration_overlay_allowed: false
    processed_write_allowed: false

