product_lines:
  004_CONTACT_GOLD:
    namespace: 004_CONTACT_GOLD
    input_sidecar_policy: FROZEN_BASE_PLUS_SEPARATE_VERSIONED_REFINEMENT
    may_refine:
      - object6d
      - object_geometry
      - object_sdf
      - contact_constraints
      - non_penetration_constraints
      - q_hand
    may_overwrite_r2: false
    may_read_other_product_mutable_outputs: false
    iteration_branch_cardinality: 1
    allowed_iteration_branches:
      - OBJECT_GEOMETRY
      - RETARGET_QHAND
      - COMPOSITOR
  EXACT78_R2_VISUAL_DOMAIN:
    namespace: EXACT78_R2_VISUAL_DOMAIN
    input_sidecar_policy: FROZEN_R2_READ_ONLY
    frozen_fields:
      - q_hand
      - wrist_T_camera
      - validity
      - confidence
      - failure_reason
      - frame_order
      - timestamp
      - hand_order
      - units
      - split
      - language
      - state
      - non_image_inputs
    only_planned_variable: image_selector
    refinement_allowed: false
    render_time_ik_allowed: false
    may_read_other_product_mutable_outputs: false

diagnostic_tracks:
  HAND_ONLY_DIAGNOSTIC:
    purpose: geometry_contact_occlusion_diagnostics
    required_outputs:
      - full_hand_mesh
      - object_layer
      - per_link_id_depth
      - object_sdf_metrics
      - contact_non_penetration_metrics
      - recommended_composite
      - thumb_only_comparison
    may_feed_formal_robot_rgb: false
  HAND_ARM_FINAL:
    purpose: complete_tianji_arm_and_kaihand_final_render
    required_outputs:
      - full_robot_rgba
      - full_link_id_depth
      - object_layer_depth
      - final_robot_rgb
    may_feed_formal_robot_rgb: true

components:
  source_resolver:
    reads: [authoritative_raw, source_manifest_request]
    writes: [verified_source_manifest]
    forbidden: [write_raw, accept_raw_substitute, accept_symlink_as_formal_frame]
  session_profiler:
    reads: [verified_source_manifest, g2_task_card_calibration_overlay]
    writes: [session_context, canary_set]
    forbidden: [write_pixels, invent_missing_measurement, session_specific_override]
  mask_benchmark_curator:
    reads: [verified_source_manifest, canary_set, benchmark_selection_protocol]
    writes: [mask_benchmark]
    forbidden: [generate_candidate_mask, tune_mask_producer, tune_auditor_thresholds, expose_blind_labels_to_mask_producer, mark_unreviewed_benchmark_frozen]
  mask_producer:
    reads: [verified_source_manifest, session_context, sam2_1_model_pin, g2_task_card_calibration_overlay]
    writes: [mask_evidence]
    forbidden: [write_clean, repair_object, decide_donor_route, read_same_session_blind_labels, read_cross_session_blind_labels, omit_producer_version_identity]
  object_geometry_producer:
    reads: [verified_source_manifest, session_context, pinned_object_model_refs]
    writes: [object_evidence, object_geometry, object_depth_sdf, object_texture_donor]
    forbidden: [erase_hand, write_background, modify_q_hand, modify_wrist, invent_metric_scale, 004_refinement_before_mask_clean_human_approval]
  reveal_policy_owner:
    reads: [project_profile, g2_task_card_calibration_overlay, formal_clean_authorization]
    writes: [verified_reveal_policy]
    forbidden: [enable_unregistered_route, accept_absolute_pixel_threshold, mark_synthetic_as_formal, enable_formal_clean_without_frozen_profile_and_authorization]
  temporal_donor_atlas:
    reads: [verified_source_manifest, session_context, mask_evidence, object_evidence, object_geometry, verified_reveal_policy]
    writes: [temporal_atlas_manifest]
    forbidden: [write_clean_pixels, include_masked_source_pixels, overlap_protected_object, use_fixed_frame_window, hidden_inpaint_fallback]
  independent_mask_qa:
    reads: [verified_source_manifest, canary_set, mask_evidence, mask_benchmark, auditor_a1_freeze_reference]
    writes: [mask_independent_qa]
    forbidden: [write_mask, modify_mask, invoke_mask_producer, self_change_thresholds, fabricate_pass, compare_across_auditor_versions, rank_incomplete_candidate_coverage, evaluate_without_frozen_benchmark]
  reveal_router:
    reads: [session_context, mask_evidence, object_evidence, object_geometry, object_texture_donor, temporal_atlas_manifest, verified_reveal_policy, project_profile, g2_task_card_calibration_overlay]
    writes: [route_decision, reveal_labels]
    forbidden: [write_clean_pixels, unregistered_route, implicit_route_switch]
    calibration_read_rule: G2_MAY_READ_G2_004_ANALYTIC_OBJECT_EVIDENCE_CONTRACT_INPUT_WITHOUT_OBJECT6D_REFINEMENT
  clean_background_producer:
    reads: [verified_source_manifest, route_decision, reveal_labels, verified_reveal_policy, object_texture_donor, temporal_atlas_manifest, g2_task_card_calibration_overlay, formal_clean_authorization]
    writes: [clean_layers, clean_coverage]
    forbidden: [render_robot, overwrite_object_with_background, modify_object_geometry, consume_synthetic_as_formal, run_formal_clean_while_formal_clean_enabled_false]
  mask_clean_review_packager:
    reads: [verified_source_manifest, canary_set, mask_evidence, mask_independent_qa, verified_reveal_policy, clean_layers, clean_coverage, g2_task_card_calibration_overlay]
    writes: [mask_clean_review_package]
    forbidden: [modify_mask, modify_clean, object6d_refinement, retarget, render_robot, composite_robot, write_final_robot_rgb]
  retarget_producer:
    reads: [frozen_motion_or_r2, object_depth_sdf, pinned_robot_model]
    writes: [resolved_retarget, contact_gold_sidecar]
    product_line_write_rules:
      004_CONTACT_GOLD: [resolved_retarget, contact_gold_sidecar]
      EXACT78_R2_VISUAL_DOMAIN: [resolved_retarget]
    forbidden: [overwrite_r2, write_image, exact78_refinement, render_time_q_hand_change, 004_execution_before_mask_clean_human_approval]
  base_ik_producer:
    reads: [resolved_retarget, object_geometry, pinned_robot_model]
    writes: [base_ik_solution]
    forbidden: [move_frozen_wrist, per_frame_base_motion, hide_unreachable_link]
  renderer:
    reads: [resolved_retarget, base_ik_solution, object_geometry, pinned_robot_assets, session_context]
    writes: [render_layers]
    forbidden: [write_clean, modify_pose, hide_failed_link, formal_thumb_only_render]
  compositor:
    reads: [clean_layers, clean_coverage, reveal_labels, render_layers, object_depth_sdf]
    writes: [geometry_composite, compositor_diagnostics, geometry_gate_result]
    forbidden: [modify_geometry, modify_q_hand, link_name_occlusion_hack, write_harmonized_appearance, pass_uncalibrated_geometry_gate]
  harmonizer:
    reads: [geometry_composite, geometry_gate_result]
    writes: [final_robot_rgb, harmonization_audit]
    forbidden: [modify_alpha, modify_depth, modify_object, modify_background, hide_geometry_failure]
  qa_evaluator:
    reads: [all_manifested_artifacts, all_diagnostics, project_profile]
    writes: [quality_report, failure_attribution, next_revision_advice]
    forbidden: [write_upstream_artifact, automatic_producer_rerun, threshold_relaxation, self_approve_manual_gate]
  promotion_manager:
    reads: [staged_session, quality_report, failure_attribution, human_review_reference]
    writes: [session_manifest, atomic_promoted_session, cohort_manifest]
    forbidden: [copy_publish, overwrite_version, publish_hold, fill_missing_from_raw, fill_missing_from_legacy]

