    aggregation: null
    pass_threshold: null
  contact_ratio:
    aggregation: null
    pass_threshold: null
  motion:
    aggregation: null
    pass_threshold: null
  blur:
    aggregation: null
    pass_threshold: null
  object6d_valid_ratio:
    aggregation: null
    pass_threshold: null
  donor_coverage:
    aggregation: null
    pass_threshold: null
  readiness: UNREVIEWED_TASK_CARD_OVERLAY_ALLOWED_FOR_G2_CANDIDATES
  unset_action: HOLD_UNSUPPORTED

quality_gates:
  order: [L0, L1, L2, L3, L4]
  L0:
    checks: [schema, ordinary_file, bytes, sha256, dimensions, frame_order, selector, manifest, raw_authority]
    thresholds: null
    failure_action: HOLD
  L1:
    checks: [human_residue, object_damage, boundary, robot_coverage, color_anomaly]
    thresholds: null
    failure_action: SINGLE_OWNER_ATTRIBUTION
  L2:
    checks: [per_link_id_depth, contact, sdf_penetration, object_robot_order]
    thresholds: null
    failure_action: BLOCK_HARMONIZER_AND_ATTRIBUTE
  L3:
    checks: [flicker, pose_jump, session_constant_base, donor_coverage, failure_clustering]
    thresholds: null
    failure_action: RETRY_REGISTERED_ROUTE_OR_HOLD
  L4:
    checks: [fixed_stress_frames, four_panel_video]
    thresholds: null
    human_review_policy: REQUIRED_WHEN_TASK_CARD_SAYS_REQUIRED
    failure_action: WAIT_FOR_HUMAN_OR_HOLD
  readiness: UNCALIBRATED
  unset_action: HOLD

harmonization:
  enabled: false
  prerequisite: L2_PASS
  allowed_regions: [robot_rgb, narrow_boundary_band]
  forbidden_channels_or_regions: [alpha, depth, object, background, geometry]
  boundary_band_formula_ref: normalization.contact_band_px
  appearance_parameters: null
  audit_required: true

promotion:
